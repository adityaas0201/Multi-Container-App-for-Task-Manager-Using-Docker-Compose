
name: Node project setup
description: Set up Node.js, cache npm packages, and install dependencies

inputs:
  project-directory:
    description: Project directory containing package.json
    required: true

  node-version:
    description: Node.js version
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.project-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: npm ci
