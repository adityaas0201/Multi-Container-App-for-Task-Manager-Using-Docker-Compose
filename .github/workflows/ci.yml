
name: Task Manager CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  schedule:
    - cron: "30 8 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    uses: ./.github/workflows/reusable-node-validation.yml
    with:
      project-directory: backend
      project-type: backend
      node-version: "22"

  frontend-build:
    name: Frontend build
    uses: ./.github/workflows/reusable-node-validation.yml
    with:
      project-directory: frontend
      project-type: frontend
      node-version: "22"

  backend-compatibility:
    name: Backend compatibility
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests
        run: npm test

  configuration-demo:
    name: Staging configuration demo
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    environment: staging

    env:
      APP_ENV: ${{ vars.APP_ENV }}

    steps:
      - name: Verify staging environment variable
        shell: bash
        run: |
          if [ "$APP_ENV" != "staging" ]; then
            echo "APP_ENV is missing or incorrect"
            exit 1
          fi

          echo "Staging environment configuration is correct"

  validation-summary:
    name: Validation summary
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build
      - backend-compatibility

    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: downloaded-frontend/

      - name: Verify downloaded files
        run: ls -la downloaded-frontend/

      - name: Confirm quality gates passed
        run: |
          echo "Backend validation passed."
          echo "Frontend validation and build passed."
          echo "Backend compatibility matrix passed."
          echo "Frontend build artifact downloaded successfully."
