
name: Task Manager CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  schedule:
    - cron: "30 8 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    uses: ./.github/workflows/reusable-node-validation.yml
    with:
      project-directory: backend
      project-type: backend
      node-version: "22"

  frontend-build:
    name: Frontend build
    uses: ./.github/workflows/reusable-node-validation.yml
    with:
      project-directory: frontend
      project-type: frontend
      node-version: "22"

  backend-compatibility:
    name: Backend compatibility
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests
        run: npm test

  configuration-demo:
    name: Staging configuration demo
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    environment: staging

    env:
      APP_ENV: ${{ vars.APP_ENV }}

    steps:
      - name: Verify staging environment variable
        shell: bash
        run: |
          if [ "$APP_ENV" != "staging" ]; then
            echo "APP_ENV is missing or incorrect"
            exit 1
          fi

          echo "Staging environment configuration is correct"


  
  docker-image-build:
    name: Build Docker images
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build
      - backend-compatibility

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: task-manager-api
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Generate frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: task-manager-frontend
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

      - name: List built Docker images
        run: docker images
  
  validation-summary:
    name: Validation summary
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build
      - backend-compatibility
      - docker-image-build

    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: downloaded-frontend/

      - name: Verify downloaded files
        run: ls -la downloaded-frontend/

      - name: Confirm quality gates passed
        run: |
          echo "Backend validation passed."
          echo "Frontend validation and build passed."
          echo "Backend compatibility matrix passed."
          echo "Docker images built successfully."


